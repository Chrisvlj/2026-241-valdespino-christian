<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="714" viewBox="0 0 1280 714">
<rect width="100%" height="100%" rx="18" fill="#111827"/>
<rect x="0" y="0" width="1280" height="44" rx="18" fill="#1f2937"/>
<text x="24" y="28" fill="#e5e7eb" font-size="18" font-family="DejaVu Sans Mono, monospace" font-weight="700">OpenCode</text>
<text x="24" y="58" fill="#22c55e" font-size="15" font-family="DejaVu Sans Mono, monospace">$ opencode --help</text>
<text x="24" y="70" fill="#d1d5db" font-size="15" font-family="DejaVu Sans Mono, monospace">⠀                                ▄     </text>
<text x="24" y="92" fill="#d1d5db" font-size="15" font-family="DejaVu Sans Mono, monospace">█▀▀█ █▀▀█ █▀▀█ █▀▀▄ █▀▀▀ █▀▀█ █▀▀█ █▀▀█</text>
<text x="24" y="114" fill="#d1d5db" font-size="15" font-family="DejaVu Sans Mono, monospace">█  █ █  █ █▀▀▀ █  █ █    █  █ █  █ █▀▀▀</text>
<text x="24" y="136" fill="#d1d5db" font-size="15" font-family="DejaVu Sans Mono, monospace">▀▀▀▀ █▀▀▀ ▀▀▀▀ ▀  ▀ ▀▀▀▀ ▀▀▀▀ ▀▀▀▀ ▀▀▀▀</text>
<text x="24" y="158" fill="#93c5fd" font-size="15" font-family="DejaVu Sans Mono, monospace">Commands:</text>
<text x="24" y="180" fill="#d1d5db" font-size="15" font-family="DejaVu Sans Mono, monospace">  opencode completion          generate shell completion script</text>
<text x="24" y="202" fill="#d1d5db" font-size="15" font-family="DejaVu Sans Mono, monospace">  opencode acp                 start ACP (Agent Client Protocol) server</text>
<text x="24" y="224" fill="#d1d5db" font-size="15" font-family="DejaVu Sans Mono, monospace">  opencode mcp                 manage MCP (Model Context Protocol) servers</text>
<text x="24" y="246" fill="#d1d5db" font-size="15" font-family="DejaVu Sans Mono, monospace">  opencode [project]           start opencode tui                                          [default]</text>
<text x="24" y="268" fill="#d1d5db" font-size="15" font-family="DejaVu Sans Mono, monospace">  opencode attach &lt;url&gt;        attach to a running opencode server</text>
<text x="24" y="290" fill="#d1d5db" font-size="15" font-family="DejaVu Sans Mono, monospace">  opencode run [message..]     run opencode with a message</text>
<text x="24" y="312" fill="#d1d5db" font-size="15" font-family="DejaVu Sans Mono, monospace">  opencode debug               debugging and troubleshooting tools</text>
<text x="24" y="334" fill="#d1d5db" font-size="15" font-family="DejaVu Sans Mono, monospace">  opencode providers           manage AI providers and credentials                   [aliases: auth]</text>
<text x="24" y="356" fill="#d1d5db" font-size="15" font-family="DejaVu Sans Mono, monospace">  opencode agent               manage agents</text>
<text x="24" y="378" fill="#d1d5db" font-size="15" font-family="DejaVu Sans Mono, monospace">  opencode upgrade [target]    upgrade opencode to the latest or a specific version</text>
<text x="24" y="400" fill="#d1d5db" font-size="15" font-family="DejaVu Sans Mono, monospace">  opencode uninstall           uninstall opencode and remove all related files</text>
<text x="24" y="422" fill="#d1d5db" font-size="15" font-family="DejaVu Sans Mono, monospace">  opencode serve               starts a headless opencode server</text>
<text x="24" y="444" fill="#d1d5db" font-size="15" font-family="DejaVu Sans Mono, monospace">  opencode web                 start opencode server and open web interface</text>
<text x="24" y="466" fill="#d1d5db" font-size="15" font-family="DejaVu Sans Mono, monospace">  opencode models [provider]   list all available models</text>
<text x="24" y="488" fill="#d1d5db" font-size="15" font-family="DejaVu Sans Mono, monospace">  opencode stats               show token usage and cost statistics</text>
<text x="24" y="510" fill="#d1d5db" font-size="15" font-family="DejaVu Sans Mono, monospace">  opencode export [sessionID]  export session data as JSON</text>
<text x="24" y="532" fill="#d1d5db" font-size="15" font-family="DejaVu Sans Mono, monospace">  opencode import &lt;file&gt;       import session data from JSON file or URL</text>
<text x="24" y="554" fill="#d1d5db" font-size="15" font-family="DejaVu Sans Mono, monospace">  opencode github              manage GitHub agent</text>
<text x="24" y="576" fill="#d1d5db" font-size="15" font-family="DejaVu Sans Mono, monospace">  opencode pr &lt;number&gt;         fetch and checkout a GitHub PR branch, then run opencode</text>
<text x="24" y="598" fill="#d1d5db" font-size="15" font-family="DejaVu Sans Mono, monospace">  opencode session             manage sessions</text>
<text x="24" y="620" fill="#d1d5db" font-size="15" font-family="DejaVu Sans Mono, monospace">  opencode plugin &lt;module&gt;     install plugin and update config                      [aliases: plug]</text>
<text x="24" y="642" fill="#d1d5db" font-size="15" font-family="DejaVu Sans Mono, monospace">  opencode db                  database tools</text>
<text x="24" y="664" fill="#d1d5db" font-size="15" font-family="DejaVu Sans Mono, monospace">Positionals:</text>
</svg>