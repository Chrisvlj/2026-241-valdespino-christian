<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="714" viewBox="0 0 1280 714">
<rect width="100%" height="100%" rx="18" fill="#111827"/>
<rect x="0" y="0" width="1280" height="44" rx="18" fill="#1f2937"/>
<text x="24" y="28" fill="#e5e7eb" font-size="18" font-family="DejaVu Sans Mono, monospace" font-weight="700">Claude Code</text>
<text x="24" y="58" fill="#22c55e" font-size="15" font-family="DejaVu Sans Mono, monospace">$ node.exe "C:\Users\veterans414\AppData\Roaming\npm\node_modules\@anthropic-ai\claude-code\cli.js" --help</text>
<text x="24" y="70" fill="#93c5fd" font-size="15" font-family="DejaVu Sans Mono, monospace">Usage: claude [options] [command] [prompt]</text>
<text x="24" y="92" fill="#d1d5db" font-size="15" font-family="DejaVu Sans Mono, monospace">Claude Code - starts an interactive session by default, use -p/--print for</text>
<text x="24" y="114" fill="#d1d5db" font-size="15" font-family="DejaVu Sans Mono, monospace">non-interactive output</text>
<text x="24" y="136" fill="#d1d5db" font-size="15" font-family="DejaVu Sans Mono, monospace">Arguments:</text>
<text x="24" y="158" fill="#d1d5db" font-size="15" font-family="DejaVu Sans Mono, monospace">  prompt                                            Your prompt</text>
<text x="24" y="180" fill="#93c5fd" font-size="15" font-family="DejaVu Sans Mono, monospace">Options:</text>
<text x="24" y="202" fill="#d1d5db" font-size="15" font-family="DejaVu Sans Mono, monospace">  --add-dir &lt;directories...&gt;                        Additional directories to allow tool access to</text>
<text x="24" y="224" fill="#d1d5db" font-size="15" font-family="DejaVu Sans Mono, monospace">  --agent &lt;agent&gt;                                   Agent for the current session. Overrides the 'agent' </text>
<text x="24" y="246" fill="#d1d5db" font-size="15" font-family="DejaVu Sans Mono, monospace">    setting.</text>
<text x="24" y="268" fill="#d1d5db" font-size="15" font-family="DejaVu Sans Mono, monospace">  --agents &lt;json&gt;                                   JSON object defining custom agents (e.g. '{"reviewer": </text>
<text x="24" y="290" fill="#d1d5db" font-size="15" font-family="DejaVu Sans Mono, monospace">    {"description": "Reviews code", "prompt": "You are a code reviewer"}}')</text>
<text x="24" y="312" fill="#d1d5db" font-size="15" font-family="DejaVu Sans Mono, monospace">  --allow-dangerously-skip-permissions              Enable bypassing all permission checks as an option, </text>
<text x="24" y="334" fill="#d1d5db" font-size="15" font-family="DejaVu Sans Mono, monospace">    without it being enabled by default. Recommended only for sandboxes with no internet access.</text>
<text x="24" y="356" fill="#d1d5db" font-size="15" font-family="DejaVu Sans Mono, monospace">  --allowedTools, --allowed-tools &lt;tools...&gt;        Comma or space-separated list of tool names to allow (e.g.</text>
<text x="24" y="378" fill="#d1d5db" font-size="15" font-family="DejaVu Sans Mono, monospace">     "Bash(git:*) Edit")</text>
<text x="24" y="400" fill="#d1d5db" font-size="15" font-family="DejaVu Sans Mono, monospace">  --append-system-prompt &lt;prompt&gt;                   Append a system prompt to the default system prompt</text>
<text x="24" y="422" fill="#d1d5db" font-size="15" font-family="DejaVu Sans Mono, monospace">  --bare                                            Minimal mode: skip hooks, LSP, plugin sync, attribution, </text>
<text x="24" y="444" fill="#d1d5db" font-size="15" font-family="DejaVu Sans Mono, monospace">    auto-memory, background prefetches, keychain reads, and CLAUDE.md auto-discovery. Sets CLAUDE_CODE_SIMPLE=1.</text>
<text x="24" y="466" fill="#d1d5db" font-size="15" font-family="DejaVu Sans Mono, monospace">     Anthropic auth is strictly ANTHROPIC_API_KEY or apiKeyHelper via --settings (OAuth and keychain are never </text>
<text x="24" y="488" fill="#d1d5db" font-size="15" font-family="DejaVu Sans Mono, monospace">    read). 3P providers (Bedrock/Vertex/Foundry) use their own credentials. Skills still resolve via </text>
<text x="24" y="510" fill="#d1d5db" font-size="15" font-family="DejaVu Sans Mono, monospace">    /skill-name. Explicitly provide context via: --system-prompt[-file], --append-system-prompt[-file], </text>
<text x="24" y="532" fill="#d1d5db" font-size="15" font-family="DejaVu Sans Mono, monospace">    --add-dir (CLAUDE.md dirs), --mcp-config, --settings, --agents, --plugin-dir.</text>
<text x="24" y="554" fill="#d1d5db" font-size="15" font-family="DejaVu Sans Mono, monospace">  --betas &lt;betas...&gt;                                Beta headers to include in API requests (API key users </text>
<text x="24" y="576" fill="#d1d5db" font-size="15" font-family="DejaVu Sans Mono, monospace">    only)</text>
<text x="24" y="598" fill="#d1d5db" font-size="15" font-family="DejaVu Sans Mono, monospace">  --brief                                           Enable SendUserMessage tool for agent-to-user </text>
<text x="24" y="620" fill="#d1d5db" font-size="15" font-family="DejaVu Sans Mono, monospace">    communication</text>
<text x="24" y="642" fill="#d1d5db" font-size="15" font-family="DejaVu Sans Mono, monospace">  --chrome                                          Enable Claude in Chrome integration</text>
<text x="24" y="664" fill="#d1d5db" font-size="15" font-family="DejaVu Sans Mono, monospace">  -c, --continue                                    Continue the most recent conversation in the current </text>
</svg>